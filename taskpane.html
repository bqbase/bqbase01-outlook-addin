<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>BQBase Email Assistant - v1.0</title>
<link rel="stylesheet" href="taskpane.css" />
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <div id="screen-loading">
    <p style="padding: 12px;">Loading...</p>
  </div>

  <div id="screen-chat" class="hidden">
    <div id="status-line"></div>
    <div id="transcript"></div>
    <textarea id="input-box" placeholder="Ask for a draft, ask a question about this email... (or drop a file here)"></textarea>
    <div id="chips-row" class="chips-row"></div>
    <div class="hint">Enter to submit &middot; Shift+Enter for a new line &middot; drag a file onto the box above to attach it</div>
    <div class="action-row">
      <button id="insertBtn" class="secondary" type="button" disabled>Insert into email</button>
      <button id="browseBtn" class="secondary" type="button">Browse for file</button>
      <input id="fileInput" type="file" multiple class="hidden" />
    </div>
  </div>

  <script src="providers.js"></script>
  <script src="mail-context.js"></script>
  <script src="attachments.js"></script>
  <script src="insert.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
